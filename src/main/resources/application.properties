spring.application.name=backend

# Render inyecta PORT en tiempo de ejecucion.
server.port=${PORT:8080}

# Supabase PostgreSQL Database — credentials must be provided via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.ebxjhioukmzpcpgnehap}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GraphQL Config
# GraphiQL expone el schema completo: util en local, apagado en produccion.
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.graphiql.path=/graphiql

# JWT Auth — JWT_SECRET must be set (>= 32 chars) via environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dominios del frontend habilitados. Ver CorsConfig.
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Health check de Render.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
