spring.application.name=backend

# Render inyecta PORT en tiempo de ejecucion.
server.port=${PORT:8080}

# Base de datos. Los tres valores vienen del entorno y NO tienen default: con un
# default, si la variable falta en el servidor, la app se conecta igual a ese
# proyecto y el error que sale manda a buscar a otro lado. Paso: tres deploys
# murieron con un "tenant/user ... not found" del pooler, nombrando el usuario
# que estaba escrito aca como default.
#
# Quitar el default no basta para que el fallo se entienda (Spring deja el
# placeholder sin resolver y Hikari tira 'url' must start with "jdbc"), asi que
# VariablesRequeridas las verifica antes de levantar el contexto.
#
# Contra el pooler de Supabase, DB_URL tiene que incluir
# ?sslmode=require&prepareThreshold=0 — sin prepareThreshold=0 el modo
# transaction pooling rompe con los prepared statements de Postgres.
#
# En Render se cargan a mano (van como sync: false en render.yaml). En local se
# apunta a H2; ver la skill arrancar-app-gastos.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GraphQL Config
# GraphiQL expone el schema completo: util en local, apagado en produccion.
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.graphiql.path=/graphiql

# JWT Auth — JWT_SECRET must be set (>= 32 chars) via environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dominios del frontend habilitados. Ver CorsConfig.
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Health check de Render.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
