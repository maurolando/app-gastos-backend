# Perfil de tests: base H2 en memoria.
#
# Los tests no deben depender de Supabase. Antes, el unico test del proyecto
# necesitaba DB_PASSWORD para levantar el contexto, asi que no corria en ninguna
# maquina sin las credenciales de produccion ni en CI; y cuando corria, lo hacia
# contra la base real con ddl-auto=update, que puede alterarle el esquema.

spring.datasource.url=jdbc:h2:mem:appgastos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se crea y se tira con cada contexto de test.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# HS256 exige una clave de al menos 256 bits. Es de juguete y solo vive aca:
# la real sigue viniendo de la variable de entorno JWT_SECRET.
jwt.secret=clave-de-firma-solo-para-tests-no-usar-en-produccion
