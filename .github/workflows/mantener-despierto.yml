# Render free duerme el servicio a los 15 min sin tráfico (~4 min para despertar) y
# Supabase free pausa la base a los ~7 días sin uso, y entonces el backend ni arranca.
# /actuator/health consulta la base, así que este ping mantiene despiertos a los dos.
# shortcut: GitHub deshabilita los cron tras 60 días sin commits en el repo; si pasa, reactivarlo en Actions o salir del plan free.
name: Mantener despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # --fail hace fallar el job si el backend está caído, y GitHub avisa por mail.
      - run: curl --fail --silent --show-error --max-time 300 https://app-gastos-backend-1a1r.onrender.com/actuator/health
